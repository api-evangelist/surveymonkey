principles:
- name: Visibility
  description: Use the SurveyMonkey admin Usage page; export response counts per survey for chargeback.
- name: Allocation
  description: Workgroups for Enterprise; use survey naming conventions otherwise.
- name: Optimization
  description: Right-size to Advantage vs Premier annually; consolidate seats; throttle long-running data exports to avoid unnecessary recompute.
- name: Accountability
  description: Assign workgroup owners; alert when annual response burn-down exceeds plan trajectory.
