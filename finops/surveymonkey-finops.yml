description: >-
  FOCUS-aligned FinOps profile for SurveyMonkey. Billing is per-user-per-month
  on the team plans (Advantage/Premier) with annual response bundles, plus
  $0.15/response overage. Enterprise contracts are negotiated. SurveyMonkey
  Audience (paid panel) is metered separately.
notes: >-
  Workgroups in Enterprise can be used to allocate cost by business unit;
  billing is annual and invoiced in USD. Public-app daily 500K request quota
  has no incremental cost as long as it stays within the API rate-limit
  schedule.
