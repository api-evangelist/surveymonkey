specification: API Commons Plans
specificationVersion: '0.1'
schema: https://raw.githubusercontent.com/api-evangelist/interface-research/main/schema/api-commons.yml#/$defs/Plans
provider: SurveyMonkey
providerId: surveymonkey
created: '2026-05-08'
modified: '2026-05-08'
reconciled: true
tags:
- Surveys
- Market Research
- Feedback
- NPS
- Forms
- Plans
- Pricing
description: >-
  SurveyMonkey sells team plans (Team Advantage / Team Premier) tiered by per-user
  per-month price with annual response bundles, an Enterprise plan, and a
  separate set of individual subscriber plans. Additional responses cost
  $0.15/response above the annual bundle.
notes: >-
  Pricing reflects public surveymonkey.com/pricing values as of 2026-05-08.
  Some API scopes require Advantage / Premier / Enterprise plans (e.g. detailed
  response data, non-weblink collectors).
sources:
- https://www.surveymonkey.com/pricing/
- https://api.surveymonkey.com/v3/docs#scopes
plans:
- id: surveymonkey-team-advantage
  name: Team Advantage
  type: subscription
  description: $30/user/month (billed annually, min 3 users); 50,000 responses/year included.
  entries:
  - label: Per-user
    name: per_user
    type: flat
    metric: user-month
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: 30
    currency: USD
    userMultiplied: true
  - label: Included annual responses
    name: included_responses
    type: tier
    metric: responses/year
    limit: 50000
    timeFrame: annual
    geo: global
    unit: 1
    price: 0
    userMultiplied: false
- id: surveymonkey-team-premier
  name: Team Premier
  type: subscription
  description: $92/user/month (billed annually, min 3 users); 100,000 responses/year included.
  entries:
  - label: Per-user
    name: per_user
    type: flat
    metric: user-month
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: 92
    currency: USD
    userMultiplied: true
  - label: Included annual responses
    name: included_responses
    type: tier
    metric: responses/year
    limit: 100000
    timeFrame: annual
    geo: global
    unit: 1
    price: 0
    userMultiplied: false
- id: surveymonkey-enterprise
  name: Enterprise
  type: enterprise
  description: Custom pricing; flexible response limits; admin tools, workgroups, premium onboarding.
  entries:
  - label: Custom contract
    name: enterprise_contract
    type: flat
    metric: contract
    limit: -1
    timeFrame: annual
    geo: global
    unit: 1
    price: contact sales
    userMultiplied: false
- id: surveymonkey-individual
  name: Individual Plans
  type: subscription
  description: Per-person plans (Standard Monthly, Advantage Annual, Premier Annual). Pricing varies; see surveymonkey.com.
  entries:
  - label: Individual plan
    name: individual_plan
    type: flat
    metric: month
    limit: -1
    timeFrame: month
    geo: global
    unit: 1
    price: see https://www.surveymonkey.com/pricing/
    userMultiplied: false
- id: surveymonkey-overage
  name: Additional responses (overage)
  type: addOn
  description: $0.15/response above the annual bundle.
  entries:
  - label: Per response overage
    name: response_overage
    type: usage
    metric: response
    limit: -1
    timeFrame: usage
    geo: global
    unit: 1
    price: 0.15
    currency: USD
    userMultiplied: false
maintainers:
